version: "3.9"

# Test infrastructure for Epic 07 Retrieval Integration Tests (Story 06)
#
# Usage:
#   docker compose -f docker-compose.test.yml up -d
#   HINDSIGHT_TEST_QDRANT_URL=http://localhost:6333 \
#   HINDSIGHT_TEST_NEO4J_URL=bolt://localhost:7687 \
#   HINDSIGHT_TEST_NEO4J_USER=neo4j \
#   HINDSIGHT_TEST_NEO4J_PASS=testpassword \
#   uv run pytest tests/test_retrieval_integration_s6.py -m integration -v
#   docker compose -f docker-compose.test.yml down

services:
  qdrant:
    image: qdrant/qdrant:v1.9.0
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"
    volumes:
      - qdrant_test_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:5.18-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/testpassword
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    volumes:
      - neo4j_test_data:/data
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 5s
      retries: 15

volumes:
  qdrant_test_data:
  neo4j_test_data:
